<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projeto Sentinela</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background"></div>

<div class="container">

    <div class="logo">
    <img src="ChatGPT Image 17_08_2026, 11_07_05.png" alt="Logo HealthSys">
</div>

    <h1>HealthSys</h1>
    <h2>sistema de saúde.</h2>

    <p>Sistema Integrado de Atendimento Hospitalar</p>

    <input
        id="usuario"
        placeholder="Usuário">

    <input
        id="senha"
        type="password"
        placeholder="Senha">

    <button onclick="login()">
        Entrar no Sistema
    </button>

</div>

<script>

function login() {

  fetch("http://localhost:3000/login", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      usuario: usuario.value,
      senha: senha.value
    })

  })

  .then(r => r.json())

  .then(data => {

    if(data.tipo === "triagem")
      location.href = "triagem.html";

    if(data.tipo === "medico")
      location.href = "medico.html";

    if(data.tipo === "atendimento")
      location.href = "atendimento.html";

  });

}

</script>

</body>
</html>
