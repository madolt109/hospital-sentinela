<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projeto Sentinela</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background"></div>

<div class="container">

    <div class="logo">
    <img src="ChatGPT Image 17_08_2026, 11_07_05.png" alt="Logo HealthSys">
</div>

    <h1>HealthSys</h1>
    <h2>sistema de saúde.</h2>

    <p>Sistema Integrado de Atendimento Hospitalar</p>

    <input
        id="usuario"
        placeholder="Usuário">

    <input
        id="senha"
        type="password"
        placeholder="Senha">

    <button onclick="login()">
        Entrar no Sistema
    </button>

</div>

<script>

async function login() {

    const usuario = document.getElementById("usuario").value.trim();
    const senha = document.getElementById("senha").value.trim();

    if (!usuario || !senha) {
        alert("Digite o usuário e a senha.");
        return;
    }

    try {

        const resposta = await fetch("/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                usuario: usuario,
                senha: senha
            })

        });

        const data = await resposta.json();

        console.log("Resposta do servidor:", data);

        if (!resposta.ok) {

            alert(data.erro || "Usuário ou senha incorretos.");

            return;
        }

        if (data.tipo === "triagem") {

            window.location.href = "triagem.html";

        } else if (data.tipo === "medico") {

            window.location.href = "medico.html";

        } else if (data.tipo === "atendimento") {

            window.location.href = "atendimento.html";

        } else {

            alert("Tipo de usuário não reconhecido.");

        }

    } catch (erro) {

        console.error("Erro no login:", erro);

        alert("Não foi possível conectar ao servidor.");

    }

}

</script>

</body>
</html>
