
<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HealthSys - Cadastro de Paciente</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background"></div>

<div class="container">

    <!-- LOGO -->

    <div class="logo">
        <img
            src="ChatGPT Image 17_08_2026, 11_07_05.png"
            alt="Logo HealthSys">
    </div>

    <h1>HealthSys</h1>

    <h2>sistema de saúde.</h2>

    <span class="subtitulo">
        Cadastro de Paciente
    </span>


    <!-- ========================= -->
    <!-- DADOS PESSOAIS -->
    <!-- ========================= -->

    <h3>👤 Dados Pessoais</h3>

    <input
        id="nome"
        type="text"
        placeholder="Nome completo">

    <input
        id="nomeSocial"
        type="text"
        placeholder="Nome social (opcional)">

    <label>Data de nascimento</label>

    <input
        id="dataNascimento"
        type="date">

    <select id="sexo">

        <option value="">Sexo biológico</option>

        <option value="feminino">
            Feminino
        </option>

        <option value="masculino">
            Masculino
        </option>

        <option value="intersexo">
            Intersexo
        </option>

        <option value="nao_informado">
            Prefiro não informar
        </option>

    </select>


    <select id="identidadeGenero">

        <option value="">
            Identidade de gênero
        </option>

        <option value="mulher_cis">
            Mulher cisgênero
        </option>

        <option value="homem_cis">
            Homem cisgênero
        </option>

        <option value="mulher_trans">
            Mulher transgênero
        </option>

        <option value="homem_trans">
            Homem transgênero
        </option>

        <option value="nao_binario">
            Não binário
        </option>

        <option value="outro">
            Outro
        </option>

        <option value="nao_informado">
            Prefiro não informar
        </option>

    </select>


    <input
        id="cpf"
        type="text"
        placeholder="CPF">

    <input
        id="rg"
        type="text"
        placeholder="RG (opcional)">


    <!-- ========================= -->
    <!-- CONTATO -->
    <!-- ========================= -->

    <h3>📞 Contato</h3>

    <input
        id="telefone"
        type="tel"
        placeholder="Telefone">

    <input
        id="celular"
        type="tel"
        placeholder="Celular">

    <input
        id="email"
        type="email"
        placeholder="E-mail">


    <!-- ========================= -->
    <!-- ENDEREÇO -->
    <!-- ========================= -->

    <h3>📍 Endereço</h3>

    <input
        id="cep"
        type="text"
        placeholder="CEP">

    <input
        id="logradouro"
        type="text"
        placeholder="Rua / Avenida">

    <input
        id="numero"
        type="text"
        placeholder="Número">

    <input
        id="complemento"
        type="text"
        placeholder="Complemento (opcional)">

    <input
        id="bairro"
        type="text"
        placeholder="Bairro">

    <input
        id="cidade"
        type="text"
        placeholder="Cidade">

    <select id="estado">

        <option value="">
            Estado
        </option>

        <option value="AC">Acre</option>
        <option value="AL">Alagoas</option>
        <option value="AP">Amapá</option>
        <option value="AM">Amazonas</option>
        <option value="BA">Bahia</option>
        <option value="CE">Ceará</option>
        <option value="DF">Distrito Federal</option>
        <option value="ES">Espírito Santo</option>
        <option value="GO">Goiás</option>
        <option value="MA">Maranhão</option>
        <option value="MT">Mato Grosso</option>
        <option value="MS">Mato Grosso do Sul</option>
        <option value="MG">Minas Gerais</option>
        <option value="PA">Pará</option>
        <option value="PB">Paraíba</option>
        <option value="PR">Paraná</option>
        <option value="PE">Pernambuco</option>
        <option value="PI">Piauí</option>
        <option value="RJ">Rio de Janeiro</option>
        <option value="RN">Rio Grande do Norte</option>
        <option value="RS">Rio Grande do Sul</option>
        <option value="RO">Rondônia</option>
        <option value="RR">Roraima</option>
        <option value="SC">Santa Catarina</option>
        <option value="SP">São Paulo</option>
        <option value="SE">Sergipe</option>
        <option value="TO">Tocantins</option>

    </select>


    <!-- ========================= -->
    <!-- CONTATO DE EMERGÊNCIA -->
    <!-- ========================= -->

    <h3>🚨 Contato de Emergência</h3>

    <input
        id="nomeEmergencia"
        type="text"
        placeholder="Nome do contato">

    <input
        id="parentescoEmergencia"
        type="text"
        placeholder="Parentesco">

    <input
        id="telefoneEmergencia"
        type="tel"
        placeholder="Telefone de emergência">


    <!-- ========================= -->
    <!-- INFORMAÇÕES DE SAÚDE -->
    <!-- ========================= -->

    <h3>🏥 Informações de Saúde</h3>

    <input
        id="tipoSanguineo"
        type="text"
        placeholder="Tipo sanguíneo (ex: O+)">

    <input
        id="alergias"
        type="text"
        placeholder="Alergias conhecidas">

    <input
        id="medicamentos"
        type="text"
        placeholder="Medicamentos de uso contínuo">

    <input
        id="doencas"
        type="text"
        placeholder="Doenças / condições de saúde">

    <textarea
        id="observacoes"
        placeholder="Observações importantes sobre o paciente"></textarea>


    <!-- ========================= -->
    <!-- PAGAMENTO -->
    <!-- ========================= -->

    <h3>💳 Atendimento</h3>

    <select id="tipoAtendimento">

        <option value="">
            Tipo de atendimento
        </option>

        <option value="convenio">
            🏥 Convênio
        </option>

        <option value="particular">
            💳 Particular
        </option>

        <option value="sus">
            🏛️ SUS
        </option>

    </select>

    <input
        id="convenio"
        type="text"
        placeholder="Nome do convênio (se possuir)">

    <input
        id="numeroConvenio"
        type="text"
        placeholder="Número da carteirinha">


    <!-- ========================= -->
    <!-- FOTO -->
    <!-- ========================= -->

    <h3>📷 Foto</h3>

    <label class="upload">

        Selecionar foto do paciente

        <input
            type="file"
            id="foto"
            accept="image/*">

    </label>


    <!-- BOTÃO -->

    <button onclick="cadastrar()">

        ➜ Cadastrar Paciente

    </button>

</div>


<script>

async function cadastrar() {

    const paciente = {

        nome:
            document.getElementById("nome").value,

        nomeSocial:
            document.getElementById("nomeSocial").value,

        dataNascimento:
            document.getElementById("dataNascimento").value,

        sexo:
            document.getElementById("sexo").value,

        identidadeGenero:
            document.getElementById("identidadeGenero").value,

        cpf:
            document.getElementById("cpf").value,

        rg:
            document.getElementById("rg").value,

        telefone:
            document.getElementById("telefone").value,

        celular:
            document.getElementById("celular").value,

        email:
            document.getElementById("email").value,

        cep:
            document.getElementById("cep").value,

        logradouro:
            document.getElementById("logradouro").value,

        numero:
            document.getElementById("numero").value,

        complemento:
            document.getElementById("complemento").value,

        bairro:
            document.getElementById("bairro").value,

        cidade:
            document.getElementById("cidade").value,

        estado:
            document.getElementById("estado").value,

        nomeEmergencia:
            document.getElementById("nomeEmergencia").value,

        parentescoEmergencia:
            document.getElementById("parentescoEmergencia").value,

        telefoneEmergencia:
            document.getElementById("telefoneEmergencia").value,

        tipoSanguineo:
            document.getElementById("tipoSanguineo").value,

        alergias:
            document.getElementById("alergias").value,

        medicamentos:
            document.getElementById("medicamentos").value,

        doencas:
            document.getElementById("doencas").value,

        observacoes:
            document.getElementById("observacoes").value,

        tipoAtendimento:
            document.getElementById("tipoAtendimento").value,

        convenio:
            document.getElementById("convenio").value,

        numeroConvenio:
            document.getElementById("numeroConvenio").value

    };


    if (!paciente.nome) {

        alert("Digite o nome completo do paciente.");

        return;

    }


    try {

        const resposta = await fetch(
            "http://localhost:3000/atendimento",
            {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(paciente)

            }
        );


        const resultado = await resposta.json();


        if (!resposta.ok) {

            alert(
                "Erro ao cadastrar paciente."
            );

            console.error(resultado);

            return;

        }


        alert(
            "✅ Paciente cadastrado com sucesso!"
        );


        console.log(
            "Paciente:",
            resultado
        );


    } catch (erro) {

        console.error(erro);

        alert(
            "❌ Não foi possível conectar ao servidor."
        );

    }

}

</script>

</body>

</html>
