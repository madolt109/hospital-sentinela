
<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Projeto Sentinela - Painel Médico</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="sidebar">

    

</div>

<div class="main">

    <header>

        <h1>👨‍⚕️ Painel Médico</h1>

        <p>Consultas e Prescrições</p>

    </header>

    <section>

        <h2>Pacientes aguardando atendimento</h2>

        <div id="triagens" class="cards"></div>

    </section>

    <section class="consulta">

        <h2>Consulta Médica</h2>

        <input id="paciente" placeholder="Paciente" readonly>

        <input id="diagnostico" placeholder="Diagnóstico">

        <select id="medicacao">
            <option value="">Selecione a medicação</option>
        </select>

        <textarea
            id="obs"
            rows="5"
            placeholder="Observações">
        </textarea>

        <button onclick="salvar()">
            💾 Salvar Consulta
        </button>

    </section>

</div>

<script>

let triagensCarregadas = [];

function carregar() {
  fetch("/triagens")
    .then(r => r.json())
    .then(data => {
      triagensCarregadas = data;

      const div = document.getElementById("triagens");
      div.innerHTML = "";

      data.forEach((t, index) => {
        div.innerHTML += `
          <div class="card">

            <h3>👤 ${t.nome}</h3>

            <p><strong>Sintoma:</strong> ${t.sintoma || "Não informado"}</p>

            <p><strong>Temperatura:</strong> ${t.temperatura || "Não informada"}°C</p>

            <p>
              <span class="${t.risco}">
                ${t.risco}
              </span>
            </p>

            <p><strong>Alergia:</strong> ${t.alergia || "Nenhuma"}</p>

            <p><strong>Observação:</strong> ${t.observacao || "Nenhuma"}</p>

            <button onclick="selecionar(${index})">
              Atender
            </button>

          </div>
        `;
      });
    });
}

function selecionar(index) {
  const t = triagensCarregadas[index];

  document.getElementById("paciente").value = t.nome;
  document.getElementById("obs").value = t.observacao || "";

  if (t.alergia && t.alergia !== "Nenhuma") {
    alert("⚠️ Paciente possui alergia: " + t.alergia);
  }
}

function carregarMedicacoes() {
  fetch("/lista-medicacoes")
    .then(r => r.json())
    .then(data => {
      const select = document.getElementById("medicacao");

      select.innerHTML = `
        <option value="">Selecione a medicação</option>
      `;

      data.forEach(med => {
        const option = document.createElement("option");
        option.value = med;
        option.textContent = med;
        select.appendChild(option);
      });
    });
}

function salvar() {
  const paciente = document.getElementById("paciente").value;
  const diagnostico = document.getElementById("diagnostico").value;
  const medicacao = document.getElementById("medicacao").value;
  const obs = document.getElementById("obs").value;

  if (!paciente) {
    alert("Selecione um paciente clicando em Atender.");
    return;
  }

  if (!medicacao) {
    alert("Selecione uma medicação.");
    return;
  }

  fetch("/consulta", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      paciente,
      diagnostico,
      medicacao,
      obs
    })
  })
  .then(r => r.json())
  .then(() => {
    alert("Consulta salva");

    document.getElementById("diagnostico").value = "";
    document.getElementById("medicacao").value = "";
    document.getElementById("obs").value = "";
  });
}

carregar();
carregarMedicacoes();

</script>

</body>
</html>
