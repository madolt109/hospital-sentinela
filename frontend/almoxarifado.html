<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<header class="navbar">
    <div class="nav-brand">
        <div class="logo-icon">

        </div>
     <div>
    <h1>Hospital Pro - Almoxarifado</h1>
    <span>Gestão de Entrada e Controle de Estoque

        </span>
     </div>
     <span class="user-pill" id="nomeUsuario">Almoxarifado</span>
     <a href="index.html" class="btn-nav">sair</a>
     </div>
</header>

<div class="container"></div>

<!--Alerta -->
<div class="alerta-estoque" id="alerta-Estoque" style="display: nome;">
    <strong>Atenção</strong> <span id="alertaTexto"></span>
</div>

<!--STATS-->
<div class="stats-btn">
    <div class="stats-card">
        <div class="stat-icon purple"></div>
        <div class="stat-value" id="statItens">-</div>
        <div class="stat-label">Tipos Cadastrados</div>
    </div>
</div>
<div class="stat-card">
    <div class="stat-icon green"></div>
    <div>
        <div class="stat-value" id="status">-</div>
        <div class="stat-label">Estoque Normal</div>
    </div>
</div>
<div class="stat-card">
    <div class="stat-icon orange"></div>
    <div>
        <div class="stat-value" id="statBaivo">-</div>
        <div class="stat-label">Estoque Baixo (menor que 10)</div>
    </div>
</div>
<div class="stat-card">
    <div class="stat-icon red"></div>
    <div>
        <div class="stat-value" id="statZerado">-</div>
        <div class="stat-label">Zerados / Esgotados</div>
     </div>
   </div>
</div>

<!--MAIN GRID-->
<div class="main-grid">

 <!-- COLUNA ESQUERDA: FORMULÀRIO ENTRADA-->
  <div>
   <div class="card">
    <div class="card-header"></div>
        <h2>Entrada de Medicamentos</h2>
    </div>
    <div class="card-body">
      
        <!--Tabs: Novo ou Repor-->
        <div class="entrada tabs">
            <button class="tab-btn active" id="tabNovo"
            onclick="setTab('novo')">Novo Medicamento</button>
            <button class="tab-btn" id="tabRepor" onclick="setTab('repor')">Repor existente</button>
        </div>

        <!--PAINEL: Cadastrar Novo-->
        <div id="painelNovo">
         <div class="form-group">
            <label class="emNome">Nome do Medicamento</label>
            <input type="text" id="emNome" class="form-control"
            placeholder="Ex: parecetomol 75dmg"
            autocomplete="off">    
         </div>
        <div class="form-group">
                        <label for="emQtd">Quantidade
                           <small>>(unidades a adicionar)</small></label>
                        <input type="number" id="emQtd"
                        class="form-control" value="10" min="1">                   
                    </div>
                    <div class="form-group">
                        <label for="emUunidade">Tipo de unidade</label>
                        <select id="emUnidade" class="form-control">
                            <option value="comprimidos">Comprimidos</option>
                              <option value="capsulas">Cápsulas</option>
                                <option value="frascos">Frascos</option>
                                  <option value="ampolas">Empola</option>
                                    <option value="sachês">Sachês</option>
                                      <option value="unidades">Unidades</option>
                 
                            </select>
                    </div>

                    <div class="form-group">
                        <label for="emCategorias">Categorias Farmacológica</label>
                        <select for="emCategorias" class="form-control">
                            <option value="Analgésico/Antipiréticos">Analgésico/Antipirético</option>
                             <option value="Antibióticos">Antibióticos</option>
                              <Option value="Anti-inflamatório">Anti-inflamatório</Option>
                                <Option value="Antialérgico">Antialérgico</Option>
                                  <Option value="Protetor Gastrico">Protetor Gastrico</Option>
                                    <Option value="Antiespamódico">Antiespamódico</Option>
                                     <Option value="Antimetico">Antimetico</Option>
                                      <Option value="Solução">Solução<Solução/Option>
                                       <Option value="Vitamina/Suplemento">Vitamina/Suplememto</Option>
                             <Option value="Geral">Geral</Option>
                        </select>
                    </div>
                    <button class="btn-full btn-purple" onclick="darEntrada()">Resgistrar Entrada no estoque</button>
                </div>

                <!--PAINEL: Repor Existente-->
                <div id="paianelRepor" style="display: none">
                    <div class="form-group">
                        <label for="selReporMed">Selecionar Medicamento</label>
                        <select id="selReporMed" class="form-control">
                            <option value="">---Selecione---</option>
                        </select>
                    </div>
                    <div class="form-group">
                      <label for="reporQtd">Quantidade a Adicionar</label>
                      <input type="number" id="reporQtd"
                      class="form-control" value="10" min="1">
                    </div>
                    <div class="form-group">
                      <label for="reporObs">Observação</label><small>(Opcional)</small>
                      <input type="text" id="reporObs" class="form-control" placeholder="Ex: nota fiscal NF-001">
                    </div>
                    <button class="btn-full btn-purple"
                    onclick="reporEstoque()">Adicionar ao estoque existente
                </button>
                </div>
            </div>
        </div>
        <!--Historico de Entrada -->
        <div class="card" style="margin-top:20px">
        <div class="card-header">
         <h2>📋 Útimas Entradas Registradas</h2>
         <button class="btn-sm btn-seconday"
         onclick="carregarHistoricoEntradas()"></button>
         <div class="card-body" id="historicoEntradas">
                <div clas="empty-state">
                    <div class="empty-icon">📋</div>
                    <p>Nenhuma entrada regis>trada ainda</p>
                </div>
            </div>
        </div>
    </div>
</div>

</body>     
</html>
