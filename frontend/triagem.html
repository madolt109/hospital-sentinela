
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Sentinela - Triagem</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="sidebar">
    <h2>🏥 Sentinela</h2>
</div>

<div class="main">
    <header>
        <h1>🩺 Triagem Hospitalar</h1>
        <p>Identificação e avaliação inicial de risco</p>
    </header>

    <div class="card">
        <label>Nome do Paciente</label>
        <input id="nome" placeholder="Digite o nome do paciente">

        <label>Sintoma Principal</label>
        <select id="sintoma">
            <option value="">Selecione</option>
            <option value="dor_leve">Dor leve</option>
            <option value="resfriado">Resfriado</option>
            <option value="coriza">Coriza</option>
            <option value="tosse">Tosse</option>
            <option value="febre">Febre</option>
            <option value="vomito">Vômito</option>
            <option value="diarreia">Diarreia</option>
            <option value="falta_ar_moderada">Falta de ar moderada</option>
            <option value="falta_ar_grave">Falta de ar grave</option>
            <option value="infarto">Suspeita de infarto</option>
            <option value="avc">Suspeita de AVC</option>
            <option value="convulsao">Convulsão</option>
            <option value="hemorragia">Hemorragia</option>
        </select>

        <label>Temperatura (°C)</label>
        <input id="temp" type="number" step="0.1"
               placeholder="Ex.: 37.5">

        <label>Alergias</label>
        <input id="alergia" placeholder="Informe alergias ou 'Não informado'">

        <label>Observações</label>
        <textarea id="observacao" rows="5"
                  placeholder="Descreva os sinais e as observações do paciente"></textarea>

        <button type="button" onclick="analisarRisco()">
            🧠 Analisar Risco
        </button>

        <div id="resultado" role="status" aria-live="polite"></div>

        <button type="button" id="btnSalvar" onclick="salvar()" disabled>
            💾 Salvar Triagem
        </button>
    </div>
</div>

<script>
let analiseAtual = null;

async function analisarRisco() {
    const nome = document.getElementById("nome").value.trim();
    const sintoma = document.getElementById("sintoma").value;
    const tempTexto = document.getElementById("temp").value;
    const alergia = document.getElementById("alergia").value.trim();
    const observacao = document.getElementById("observacao").value.trim();
    const resultado = document.getElementById("resultado");
    const btnSalvar = document.getElementById("btnSalvar");

    analiseAtual = null;
    btnSalvar.disabled = true;
    resultado.replaceChildren();

    if (!nome || !sintoma || tempTexto === "") {
        resultado.textContent =
            "Preencha o nome, o sintoma principal e a temperatura.";
        return;
    }

    const temperatura = Number(tempTexto);

    if (!Number.isFinite(temperatura) ||
        temperatura < 25 || temperatura > 45) {
        resultado.textContent = "Confira a temperatura informada.";
        return;
    }

    resultado.textContent = "Analisando os dados...";

    try {
        const resposta = await fetch("/analisar-risco", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sintoma, temperatura, observacao })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
            throw new Error(dados.erro || "Não foi possível analisar.");
        }

        analiseAtual = {
            nome,
            sintoma,
            temperatura,
            alergia,
            observacao,
            risco: dados.risco
        };

        resultado.replaceChildren();

        const titulo = document.createElement("h3");
        titulo.textContent = "Resultado da análise: " +
            dados.risco.toUpperCase();

        const explicacao = document.createElement("p");
        explicacao.textContent = dados.motivo;

        const aviso = document.createElement("p");
        aviso.textContent = dados.urgente
            ? "ATENÇÃO: procure avaliação imediata da equipe de saúde."
            : "Resultado preliminar. A equipe de saúde deve confirmar a classificação.";

        resultado.className = dados.risco;
        resultado.append(titulo, explicacao, aviso);

        btnSalvar.disabled = false;

    } catch (erro) {
        resultado.className = "";
        resultado.textContent =
            "Erro ao analisar. Verifique se o backend está funcionando.";
        console.error(erro);
    }
}

async function salvar() {
    if (!analiseAtual) {
        alert("Faça a análise antes de salvar.");
        return;
    }

    try {
        const resposta = await fetch("/triagem", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(analiseAtual)
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
            throw new Error(dados.erro || "Erro ao salvar.");
        }

        alert("Triagem salva com sucesso!");
        document.getElementById("resultado").textContent =
            "Triagem registrada. Classificação preliminar: " +
            dados.risco.toUpperCase();

        analiseAtual = null;
        document.getElementById("btnSalvar").disabled = true;

    } catch (erro) {
        alert("Não foi possível salvar. Verifique o backend.");
        console.error(erro);
    }
}

// Se os dados mudarem, é necessário analisar novamente.
["nome", "sintoma", "temp", "alergia", "observacao"].forEach(id => {
    document.getElementById(id).addEventListener("input", invalidarAnalise);
    document.getElementById(id).addEventListener("change", invalidarAnalise);
});

function invalidarAnalise() {
    analiseAtual = null;
    document.getElementById("btnSalvar").disabled = true;
    document.getElementById("resultado").textContent =
        "Dados alterados. Faça uma nova análise antes de salvar.";
}
</script>

</body>
</html>
