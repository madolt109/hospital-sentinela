
<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Projeto Sentinela - Triagem</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="sidebar">

    <h2>🏥 Sentinela</h2>

   

</div>

<div class="main">

<header>

<h1>🩺 Triagem Hospitalar</h1>

<p>Classificação de risco do paciente</p>

</header>

<div class="card">

<label>Nome do Paciente</label>

<input
id="nome"
placeholder="Digite o nome do paciente">

<label>Sintoma Principal</label>

<select id="sintoma">

<option value="">Selecione</option>
<option value="dor_leve">Dor leve</option>
<option value="resfriado">Resfriado</option>
<option value="coriza">Coriza</option>
<option value="tosse">Tosse</option>
<option value="febre">Febre</option>
<option value="vomito">Vômito</option>
<option value="diarreia">Diarreia</option>
<option value="falta_ar_moderada">Falta de ar moderada</option>
<option value="falta_ar_grave">Falta de ar grave</option>
<option value="infarto">Suspeita de infarto</option>
<option value="avc">Suspeita de AVC</option>
<option value="convulsao">Convulsão</option>
<option value="hemorragia">Hemorragia</option>

</select>

<label>Temperatura</label>

<input
id="temp"
type="number"
placeholder="Ex.: 37.5">

<label>Alergias</label>

<input
id="alergia"
placeholder="Informe alergias">

<label>Observações</label>

<textarea
id="observacao"
rows="5"
placeholder="Observações do paciente"></textarea>

<div id="resultado"></div>

<button onclick="salvar()">

💾 Salvar Triagem

</button>

</div>

</div>

<script>

function classificarRisco(sintoma, temperatura){

  const vermelhos = [
    "infarto",
    "avc",
    "convulsao",
    "hemorragia",
    "falta_ar_grave"
  ];

  const amarelos = [
    "febre",
    "vomito",
    "diarreia",
    "falta_ar_moderada"
  ];

  if (temperatura >= 39) return "vermelho";
  if (vermelhos.includes(sintoma)) return "vermelho";
  if (amarelos.includes(sintoma)) return "amarelo";

  return "verde";
}

function salvar(){

const nome=document.getElementById("nome").value;
const sintoma=document.getElementById("sintoma").value;
const temperatura=Number(document.getElementById("temp").value);
const alergia=document.getElementById("alergia").value;
const observacao=document.getElementById("observacao").value;

const risco=classificarRisco(sintoma,temperatura);

fetch("http://localhost:3000/triagem",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

nome,
sintoma,
temperatura,
alergia,
observacao,
risco

})

})

.then(r=>r.json())

.then(()=>{

const resultado=document.getElementById("resultado");

resultado.className=risco;

resultado.innerHTML="Classificação: <strong>"+risco.toUpperCase()+"</strong>";

alert("Triagem salva");

});

}

</script>

</body>
</html>
